server {
    listen 80;
    server_name localhost;

    early_hints on;
    etag on;

    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    add_header Accept-Ranges "bytes" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Encoding "zstd" always;
    add_header Server-Timing 'dn-cache;desc="HIT", db;dur=14.2, render;dur=22.8' always;
    add_header Timing-Allow-Origin "*" always;
    add_header Vary "Accept-Encoding" always;

    add_header Age "0" always;
    add_header Last-Modified $date_gmt always;
    add_header Link '<$scheme://$host$request_uri>; rel="canonical"' always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    proxy_buffer_size 32k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    location /_next/static/ {
        proxy_pass http://umamusume-app:3000;
        proxy_cache_valid 200 365d;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://umamusume-app:3000;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://umamusume-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;

        proxy_hide_header Accept-Ranges;
        proxy_hide_header Alt-Svc;
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Encoding;
        proxy_hide_header Server-Timing;
        proxy_hide_header Timing-Allow-Origin;
        proxy_hide_header Vary;
        proxy_hide_header Age;
        proxy_hide_header Last-Modified;
        proxy_hide_header Link;
    }
}
